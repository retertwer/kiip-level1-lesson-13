<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIIP Level 1 - 13과 버스로 공항에 가요</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --background: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
        }
        body {
            font-family: 'Hanuman', 'Noto Sans KR', sans-serif;
            background: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E5E7EB;
            font-size: 1.1rem;
        }
        .power-ups {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-powerup { background: var(--warning); color: white; }
        .btn-powerup:disabled { background: #D1D5DB; cursor: not-allowed; }
        .btn-play { background: #3B82F6; color: white; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 15px;}
        .passage {
            background: #E5E7EB;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: none;
        }
        .question-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .translation-text { color: var(--primary); font-size: 1rem; margin-bottom: 15px; display: none; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 15px;
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .option:hover:not(.disabled) { background: #EEF2FF; border-color: var(--primary); }
        .option.selected.correct { background: var(--secondary); color: white; border-color: var(--secondary); }
        .option.selected.wrong { background: var(--danger); color: white; border-color: var(--danger); }
        .option.show-correct { background: var(--secondary); color: white; border-color: var(--secondary); }
        .option.disabled { opacity: 0.5; pointer-events: none; }
        .option.hidden { display: none; }
        .option-kh { font-size: 0.9rem; margin-top: 5px; color: #4B5563; display: none; }
        .option.selected .option-kh, .option.show-correct .option-kh { color: #f3f4f6; }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ECFDF5;
            border-left: 5px solid var(--secondary);
            animation: fadeIn 0.5s;
        }
        .feedback.wrong-feedback { background: #FEF2F2; border-left-color: var(--danger); }
        .feedback-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .vocab-box { margin-top: 15px; background: #FFFBEB; padding: 15px; border-radius: 6px; border-left: 4px solid var(--warning); }
        
        .btn-next {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 20px;
            display: none;
        }
        .review-screen { display: none; text-align: center; }
        .review-item { text-align: left; background: #f9fafb; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>KIIP កម្រិត 1 - មេរៀនទី 13<br>(13과 버스로 공항에 가요)</h1>
    
    <div id="quiz-screen">
        <div class="status-bar">
            <span id="score-display">ពិន្ទុ: 0 / 30</span>
            <span id="question-number">សំណួរទី: 1 / 30</span>
        </div>

        <div class="power-ups">
            <button class="btn btn-powerup" id="btn-trans-q" onclick="usePowerUp('translate_q')">👁️ បកប្រែសំណួរ</button>
            <button class="btn btn-powerup" id="btn-fifty" onclick="usePowerUp('fifty')">✂️ កាត់ 50/50</button>
            <button class="btn btn-powerup" id="btn-trans-a" onclick="usePowerUp('translate_a')">👁️ បកប្រែចម្លើយ</button>
        </div>

        <button class="btn btn-play" onclick="playQuestionAudio()">🔈 ស្តាប់សម្លេង (Play)</button>

        <div id="passage-container" class="passage"></div>

        <div class="question-text" id="question-ko"></div>
        <div class="translation-text" id="question-km"></div>

        <div class="options" id="options-container">
            </div>

        <div id="feedback-container" class="feedback">
            <div id="feedback-title" class="feedback-title"></div>
            <div id="feedback-exp-ko" style="font-weight: bold; margin-bottom: 5px;"></div>
            <div id="feedback-exp-km" style="margin-bottom: 10px;"></div>
            <div id="vocab-container" class="vocab-box"></div>
        </div>

        <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">សំណួរបន្ទាប់ ➡️</button>
    </div>

    <div id="review-screen" class="review-screen">
        <h2>🎉 លទ្ធផលរបស់អ្នក!</h2>
        <h3 id="final-score" style="color: var(--primary); font-size: 2rem;"></h3>
        <p>ខាងក្រោមនេះជាការរំលឹកឡើងវិញនូវសំណួរទាំងអស់៖</p>
        <div id="review-list"></div>
        <button class="btn btn-next" style="display: block; width: auto; margin: 20px auto;" onclick="location.reload()">🔄 ធ្វើតេស្តម្តងទៀត</button>
    </div>
</div>

<script>
const questions = [
    // ផ្នែកទី១៖ ពាក្យសព្ទ និងវេយ្យាករណ៍ (1-10)
    {
        part: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍",
        q_ko: "집에서 회사까지 (      ) 가요.",
        q_km: "តើអ្នកទៅក្រុមហ៊ុនពីផ្ទះ...?",
        options_ko: ["버스가", "버스를", "버스로", "버스에"],
        options_km: ["ឡានក្រុង(ប្រធាន)", "ឡានក្រុង(កម្មបទ)", "ដោយឡានក្រុង", "នៅឡានក្រុង"],
        answer: 2,
        exp_ko: "교통수단을 나타낼 때는 명사 뒤에 '-(으)로'를 사용합니다.",
        exp_km: "នៅពេលបញ្ជាក់ពីមធ្យោបាយធ្វើដំណើរ យើងប្រើទម្រង់ '-(으)로' (ដោយ/តាម)។",
        vocab: [ {ko: "회사", km: "ក្រុមហ៊ុន"}, {ko: "버스", km: "ឡានក្រុង"} ]
    },
    {
        part: "ផ្នែកពាក្យសព្ទ 및 វេយ្យាករណ៍",
        q_ko: "오후에 친구를 (      ) 공항에 가요.",
        q_km: "នៅពេលរសៀល ខ្ញុំទៅអាកាសយានដ្ឋាន...មិត្តភក្តិ។",
        options_ko: ["만나러", "만나고", "만나서", "만나지만"],
        options_km: ["ដើម្បីជួប", "ជួបហើយ", "ដោយសារតែជួប", "ជួបប៉ុន្តែ"],
        answer: 0,
        exp_ko: "어떤 장소에 가는 목적을 나타낼 때는 동사 뒤에 '-(으)러 가다/오다'를 씁니다.",
        exp_km: "ដើម្បីបញ្ជាក់ពីគោលបំណងនៃការទៅកាន់ទីតាំងណាមួយ គេប្រើ '-(으)러 가다/오다' (ទៅ/មក ដើម្បី...)។",
        vocab: [ {ko: "공항", km: "អាកាសយានដ្ឋាន/ព្រលានយន្តហោះ"}, {ko: "만나다", km: "ជួប"} ]
    },
    {
        part: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍",
        q_ko: "베트남 돈을 한국 돈으로 (      ) 은행에 가요.",
        q_km: "ខ្ញុំទៅធនាគារដើម្បី...លុយវៀតណាមទៅជាលុយកូរ៉េ។",
        options_ko: ["환전하러", "쇼핑하러", "수영하러", "공부하러"],
        options_km: ["ប្តូរប្រាក់", "ដើរទិញអីវ៉ាន់", "ហែលទឹក", "រៀន"],
        answer: 0,
        exp_ko: "외국 돈을 다른 나라 돈으로 바꾸는 것을 '환전하다'라고 합니다.",
        exp_km: "ការប្តូរប្រាក់បរទេសទៅជាលុយមួយទៀត ប្រើពាក្យ '환전하다' (ប្តូរប្រាក់)។",
        vocab: [ {ko: "환전하다", km: "ប្តូរប្រាក់"}, {ko: "은행", km: "ធនាគារ"} ]
    },
    {
        part: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍",
        q_ko: "부산에 갈 때 서울역에서 (      )를 타요.",
        q_km: "ពេលទៅប៊ូសាន ខ្ញុំជិះ...នៅស្ថានីយ៍សេអ៊ូល។",
        options_ko: ["비행기", "기차", "자전거", "배"],
        options_km: ["យន្តហោះ", "រថភ្លើង", "កង់", "កប៉ាល់/ទូក"],
        answer: 1,
        exp_ko: "서울역은 기차를 타는 곳(기차역)입니다.",
        exp_km: "서울역 (ស្ថានីយ៍សេអ៊ូល) គឺជាកន្លែងសម្រាប់ជិះរថភ្លើង (기차)។",
        vocab: [ {ko: "기차", km: "រថភ្លើង"}, {ko: "타다", km: "ជិះ"} ]
    },
    {
        part: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍",
        q_ko: "가: 회사까지 어떻게 가요?\n나: 집이 가까워서 (      ) 가요.",
        q_km: "ក: តើអ្នកទៅក្រុមហ៊ុនដោយរបៀបណា?\nខ: ដោយសារផ្ទះនៅជិត ខ្ញុំ...ទៅ។",
        options_ko: ["뛰어서", "걸어서", "타서", "운전해서"],
        options_km: ["រត់", "ដើរ", "ជិះ", "បើកបរ"],
        answer: 1,
        exp_ko: "가까운 거리를 두 발로 갈 때는 '걸어서 가다'라고 합니다.",
        exp_km: "ចំពោះចម្ងាយជិត គេច្រើនប្រើពាក្យ '걸어서 가다' (ដើរទៅ)។",
        vocab: [ {ko: "가깝다", km: "ជិត"}, {ko: "걷다", km: "ដើរ"} ]
    },
    {
        part: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍",
        q_ko: "오늘 늦게 일어났습니다. 그래서 버스를 타지 않고 (
