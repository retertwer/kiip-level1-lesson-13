<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIIP Level 1 - 13과 버스로 공항에 가요</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --background: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
        }
        body {
            font-family: 'Hanuman', 'Noto Sans KR', sans-serif;
            background: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E5E7EB;
            font-size: 1.1rem;
        }
        .power-ups {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-powerup { background: var(--warning); color: white; }
        .btn-powerup:disabled { background: #D1D5DB; cursor: not-allowed; }
        .btn-play { background: #3B82F6; color: white; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 15px;}
        .passage {
            background: #E5E7EB;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: none;
        }
        .question-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .translation-text { color: var(--primary); font-size: 1rem; margin-bottom: 15px; display: none; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 15px;
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .option:hover:not(.disabled) { background: #EEF2FF; border-color: var(--primary); }
        .option.selected.correct { background: var(--secondary); color: white; border-color: var(--secondary); }
        .option.selected.wrong { background: var(--danger); color: white; border-color: var(--danger); }
        .option.show-correct { background: var(--secondary); color: white; border-color: var(--secondary); }
        .option.disabled { opacity: 0.5; pointer-events: none; }
        .option.hidden { display: none; }
        .option-kh { font-size: 0.9rem; margin-top: 5px; color: #4B5563; display: none; }
        .option.selected .option-kh, .option.show-correct .option-kh { color: #f3f4f6; }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ECFDF5;
            border-left: 5px solid var(--secondary);
            animation: fadeIn 0.5s;
        }
        .feedback.wrong-feedback { background: #FEF2F2; border-left-color: var(--danger); }
        .feedback-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .vocab-box { margin-top: 15px; background: #FFFBEB; padding: 15px; border-radius: 6px; border-left: 4px solid var(--warning); }
        
        .btn-next {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 20px;
            display: none;
        }
        .review-screen { display: none; text-align: center; }
        .review-item { text-align: left; background: #f9fafb; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>KIIP កម្រិត 1 - មេរៀនទី 13<br>(13과 버스로 공항에 가요)</h1>
    
    <div id="quiz-screen">
        <div class="status-bar">
            <span id="score-display">ពិន្ទុ: 0 / 30</span>
            <span id="question-number">សំណួរទី: 1 / 30</span>
        </div>

        <div class="power-ups">
            <button class="btn btn-powerup" id="btn-trans-q" onclick="usePowerUp('translate_q')">👁️ បកប្រែសំណួរ</button>
            <button class="btn btn-powerup" id="btn-fifty" onclick="usePowerUp('fifty')">✂️ កាត់ 50/50</button>
            <button class="btn btn-powerup" id="btn-trans-a" onclick="usePowerUp('translate_a')">👁️ បកប្រែចម្លើយ</button>
        </div>

        <button class="btn btn-play" onclick="playQuestionAudio()">🔈 ស្តាប់សម្លេង (Play)</button>

        <div id="passage-container" class="passage"></div>

        <div class="question-text" id="question-ko"></div>
        <div class="translation-text" id="question-km"></div>

        <div class="options" id="options-container">
            </div>

        <div id="feedback-container" class="feedback">
            <div id="feedback-title" class="feedback-title"></div>
            <div id="feedback-exp-ko" style="font-weight: bold; margin-bottom: 5px;"></div>
            <div id="feedback-exp-km" style="margin-bottom: 10px;"></div>
            <div id="vocab-container" class="vocab-box"></div>
        </div>

        <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">សំណួរបន្ទាប់ ➡️</button>
    </div>

    <div id="review-screen" class="review-screen">
        <h2>🎉 លទ្ធផលរបស់អ្នក!</h2>
        <h3 id="final-score" style="color: var(--primary); font-size: 2rem;"></h3>
        <p>ខាងក្រោមនេះជាការរំលឹកឡើងវិញនូវសំណួរទាំងអស់៖</p>
        <div id="review-list"></div>
        <button class="btn btn-next" style="display: block; width: auto; margin: 20px auto;" onclick="location.reload()">🔄 ធ្វើតេស្តម្តងទៀត</button>
    </div>
</div>

<script>
const questions = [

    {

        options_ko: ["무료 탑승", "환승 할인", "현금 영수증", "포인트 적립"],

        exp_km: "ការបញ្ចុះតម្លៃនៅពេលប្តូរមធ្យោបាយធ្វើដំណើរហៅថា '환승 할인' (Hwan-seung Hal-in)។",

    },

        q_ko: "직장에서 자신보다 나이가 많거나 직급이 높은 사람(사장님, 부장님 등)에게 지켜야 할 예절은 무엇입니까?",
        q_km: "នៅកន្លែងធ្វើការ តើមារយាទអ្វីដែលត្រូវគោរពចំពោះអ្នកដែលមានអាយុច្រើនជាង ឬមានឋានៈខ្ពស់ជាង (ដូចជាថៅកែ ប្រធានផ្នែកជាដើម)?",
        options_ko: ["반말을 합니다.", "이름을 그냥 부릅니다.", "높임말을 사용합니다.", "인사를 하지 않습니다."],
        options_km: ["ប្រើពាក្យសាមញ្ញ(គ្មានការគោរព)", "ហៅឈ្មោះទទេ", "ប្រើពាក្យគួរសម(ទម្រង់គោរព)", "មិនធ្វើការស្វាគមន៍"],

    },
    {
        part: "ផ្នែកវប្បធម៌ និងចំណេះដឹងសង្គមកូរ៉េ",
        q_ko: "한국의 드라마, 케이팝(K-Pop), 영화 등이 세계 여러 나라에서 인기를 얻으며 한국 문화를 즐기는 현상을 무엇이라고 합니까?",
        q_km: "តើបាតុភូតដែលរឿងភាគ K-Pop និងភាពយន្តកូរ៉េទទួលបានការពេញនិយមនៅជុំវិញពិភពលោក ហើយមនុស្ស 즐기문화를កូរ៉េ ហៅថាអ្វី?",
        options_ko: ["한옥", "한복", "한글", "한류"],
        options_km: ["ផ្ទះបុរាណកូរ៉េ", "សម្លៀកបំពាក់កូរ៉េ", "អក្សរកូរ៉េ", "រលកវប្បធម៌កូរ៉េ (Hallyu)"],
        answer: 3,
        exp_ko: "한국 대중문화가 세계적으로 유행하는 현상을 '한류(Korean Wave)'라고 합니다.",
        exp_km: "ភាពល្បីល្បាញនៃវប្បធម៌កម្សាន្តកូរ៉េនៅលើឆាកអន្តរជាតិហៅថា '한류' (Hallyu - រលកកូរ៉េ)។",
        vocab: [ {ko: "세계", km: "ពិភពលោក"}, {ko: "인기를 얻다", km: "ទទួលបានប្រជាប្រិយភាព"} ]
    }
];

let currentIndex = 0;
let score = 0;
let answered = false;
let userAnswers = [];
let powerUps = { translate_q: true, fifty: true, translate_a: true };

const elements = {
    qNum: document.getElementById('question-number'),
    score: document.getElementById('score-display'),
    passage: document.getElementById('passage-container'),
    qKo: document.getElementById('question-ko'),
    qKm: document.getElementById('question-km'),
    options: document.getElementById('options-container'),
    feedback: document.getElementById('feedback-container'),
    btnNext: document.getElementById('btn-next'),
    quizScreen: document.getElementById('quiz-screen'),
    reviewScreen: document.getElementById('review-screen')
};

function loadQuestion() {
    answered = false;
    const q = questions[currentIndex];
    
    // Reset UI
    elements.qKm.style.display = 'none';
    elements.feedback.style.display = 'none';
    elements.btnNext.style.display = 'none';
    elements.options.innerHTML = '';
    
    // Update Power-ups
    document.getElementById('btn-trans-q').disabled = !powerUps.translate_q;
    document.getElementById('btn-fifty').disabled = !powerUps.fifty;
    document.getElementById('btn-trans-a').disabled = !powerUps.translate_a;

    // Status
    elements.qNum.innerText = `សំណួរទី: ${currentIndex + 1} / ${questions.length} (${q.part})`;
    elements.score.innerText = `ពិន្ទុ: ${score} / ${questions.length}`;

    // Passage handling
    if (q.passage_ko) {
        elements.passage.style.display = 'block';
        elements.passage.innerHTML = `<strong>[អត្ថបទ]</strong><br>${q.passage_ko}<br><span class="option-kh" id="passage-km">${q.passage_km}</span>`;
    } else {
        elements.passage.style.display = 'none';
    }

    elements.qKo.innerText = `${currentIndex + 1}. ${q.q_ko}`;
    elements.qKm.innerText = q.q_km;

    // Load Options
    q.options_ko.forEach((optKo, idx) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.id = `opt-${idx}`;
        div.innerHTML = `${idx + 1}. ${optKo} <div class="option-kh">${q.options_km[idx]}</div>`;
        div.onclick = () => selectOption(idx);
        elements.options.appendChild(div);
    });
}

function selectOption(idx) {
    if (answered) return;
    answered = true;
    
    const q = questions[currentIndex];
    const isCorrect = (idx === q.answer);
    
    userAnswers.push({ q: q, selected: idx, isCorrect: isCorrect });

    if (isCorrect) score++;
    
    elements.score.innerText = `ពិន្ទុ: ${score} / ${questions.length}`;

    // Disable all options
    Array.from(elements.options.children).forEach((child, i) => {
        child.classList.add('disabled');
        if (i === q.answer) child.classList.add('show-correct');
        // Show Khmer answers automatically after selection
        child.querySelector('.option-kh').style.display = 'block';
    });

    const selectedDiv = document.getElementById(`opt-${idx}`);
    selectedDiv.classList.add('selected');
    selectedDiv.classList.add(isCorrect ? 'correct' : 'wrong');

    // Show Translation of Question and Passage
    elements.qKm.style.display = 'block';
    if(q.passage_ko) document.getElementById('passage-km').style.display = 'block';

    // Show Feedback
    elements.feedback.style.display = 'block';
    elements.feedback.className = `feedback ${isCorrect ? '' : 'wrong-feedback'}`;
    document.getElementById('feedback-title').innerText = isCorrect ? '🎉 ត្រឹមត្រូវ!' : '❌ មិនទាន់ត្រឹមត្រូវទេ!';
    document.getElementById('feedback-title').style.color = isCorrect ? 'var(--secondary)' : 'var(--danger)';
    
    document.getElementById('feedback-exp-ko').innerText = q.exp_ko;
    document.getElementById('feedback-exp-km').innerText = q.exp_km;
    
    const vocabBox = document.getElementById('vocab-container');
    if (q.vocab && q.vocab.length > 0) {
        vocabBox.style.display = 'block';
        let vocabHtml = '<strong>ពាក្យគន្លឹះ៖</strong><br>';
        q.vocab.forEach(v => { vocabHtml += `• ${v.ko} = ${v.km}<br>`; });
        vocabBox.innerHTML = vocabHtml;
    } else {
        vocabBox.style.display = 'none';
    }

    elements.btnNext.style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showReview();
    }
}

function usePowerUp(type) {
    if (answered) return;
    
    if (type === 'translate_q' && powerUps.translate_q) {
        elements.qKm.style.display = 'block';
        if(questions[currentIndex].passage_ko) document.getElementById('passage-km').style.display = 'block';
        powerUps.translate_q = false; 
        document.getElementById('btn-trans-q').disabled = true;
    } 
    else if (type === 'fifty' && powerUps.fifty) {
        const q = questions[currentIndex];
        let hiddenCount = 0;
        Array.from(elements.options.children).forEach((child, i) => {
            if (i !== q.answer && hiddenCount < 2) {
                child.classList.add('hidden');
                hiddenCount++;
            }
        });
        powerUps.fifty = false;
        document.getElementById('btn-fifty').disabled = true;
    }
    else if (type === 'translate_a' && powerUps.translate_a) {
        Array.from(elements.options.children).forEach(child => {
            child.querySelector('.option-kh').style.display = 'block';
        });
        powerUps.translate_a = false;
        document.getElementById('btn-trans-a').disabled = true;
    }
}

function playQuestionAudio() {
    if (!('speechSynthesis' in window)) {
        alert("កម្មវិធីរុករករបស់អ្នកមិនគាំទ្រប្រព័ន្ធសម្លេងទេ។");
        return;
    }
    window.speechSynthesis.cancel(); // Stop any playing audio
    const q = questions[currentIndex];
    
    let textToRead = "";
    if (q.passage_ko) textToRead += q.passage_ko + " ";
    textToRead += q.q_ko;
    
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = 'ko-KR'; // Korean
    utterance.rate = 0.9; // Slightly slower for learning
    
    window.speechSynthesis.speak(utterance);
}

function showReview() {
    elements.quizScreen.style.display = 'none';
    elements.reviewScreen.style.display = 'block';
    
    document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
    
    const reviewList = document.getElementById('review-list');
    userAnswers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
            <strong>${i+1}. ${ans.q.q_ko}</strong><br>
            <span style="color: gray; font-size: 0.9rem;">${ans.q.q_km}</span><br>
            ចម្លើយរបស់អ្នក: <span style="color: ${ans.isCorrect ? 'green' : 'red'}; font-weight: bold;">${ans.q.options_ko[ans.selected]}</span> 
            ${!ans.isCorrect ? `(ចម្លើយត្រូវ: <span style="color: green;">${ans.q.options_ko[ans.q.answer]}</span>)` : ''}<br>
            <div style="margin-top: 5px; font-size: 0.9rem; background: #eef2ff; padding: 5px; border-radius: 4px;">
                ${ans.q.exp_km}
            </div>
        `;
        reviewList.appendChild(item);
    });
}

// Start the quiz
loadQuestion();
</script>
